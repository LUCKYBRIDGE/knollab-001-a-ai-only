<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f5d50">
  <meta name="description" content="카페에서 음료를 고르고 주문하는 과정을 혼자 연습하는 웹사이트">
  <title>카페 주문 연습</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">주문 연습으로 바로 가기</a>

  <header class="site-header">
    <div class="brand" aria-label="카페 주문 연습">
      <span class="brand-mark" aria-hidden="true">☕</span>
      <div>
        <p class="brand-kicker">혼자 해보는 생활 연습</p>
        <h1>카페 주문 연습</h1>
      </div>
    </div>
    <button class="utility-button" id="resetButton" type="button" hidden>
      <span aria-hidden="true">↺</span> 처음부터
    </button>
  </header>

  <main id="main-content" class="app-shell">
    <section class="practice-panel" aria-labelledby="screenTitle">
      <div class="progress-wrap" id="progressWrap" hidden>
        <div class="progress-topline">
          <span id="stepLabel">1단계 / 4단계</span>
          <span id="stepName">음료 고르기</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>

      <div class="screen-heading">
        <div>
          <p class="eyebrow" id="eyebrow">카페에 왔어요</p>
          <h2 id="screenTitle">주문을 연습해 볼까요?</h2>
          <p class="screen-help" id="screenHelp">화면에 보이는 큰 버튼을 하나씩 눌러 주문을 완성해 보세요.</p>
        </div>
        <button class="listen-button" id="listenButton" type="button" aria-label="현재 화면 안내를 소리 내어 읽기">
          <span aria-hidden="true">🔊</span>
          <span>읽어주기</span>
        </button>
      </div>

      <div id="screenContent" class="screen-content"></div>
      <p class="status-message" id="statusMessage" role="status" aria-live="polite"></p>

      <div class="navigation-row" id="navigationRow" hidden>
        <button class="secondary-button" id="backButton" type="button">
          <span aria-hidden="true">←</span> 이전
        </button>
        <button class="primary-button" id="nextButton" type="button">
          다음 <span aria-hidden="true">→</span>
        </button>
      </div>
    </section>

    <aside class="order-summary" id="orderSummary" aria-labelledby="summaryTitle" hidden>
      <div class="summary-heading">
        <div>
          <p class="summary-kicker">내가 고른 내용</p>
          <h2 id="summaryTitle">주문표</h2>
        </div>
        <span class="summary-icon" aria-hidden="true">🧾</span>
      </div>
      <div id="summaryContent" class="summary-content"></div>
    </aside>
  </main>

  <div class="modal-backdrop" id="resetModal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="resetModalTitle" aria-describedby="resetModalText">
      <div class="modal-icon" aria-hidden="true">↺</div>
      <h2 id="resetModalTitle">처음부터 다시 할까요?</h2>
      <p id="resetModalText">지금까지 고른 내용이 모두 지워져요.</p>
      <div class="modal-actions">
        <button class="secondary-button" id="cancelResetButton" type="button">계속하기</button>
        <button class="danger-button" id="confirmResetButton" type="button">처음부터 하기</button>
      </div>
    </section>
  </div>

  <noscript>
    <div class="noscript-message">이 주문 연습은 자바스크립트가 켜져 있어야 사용할 수 있습니다.</div>
  </noscript>

  <script src="script.js"></script>
</body>
</html>
