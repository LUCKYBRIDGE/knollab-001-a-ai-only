<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172b27">
  <meta name="description" content="카페 주문 연습의 실험별, 버전별 결과를 직접 체험해 보세요.">
  <title>카페 주문 연습 · 실험 A</title>
  <link rel="stylesheet" href="shell.css">
  <script src="shell.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#experience">체험 화면으로 바로 가기</a>
  <div class="site-shell">
    <header class="switcher" aria-label="실험 및 버전 선택">
      <div class="heading-row">
        <div class="brand-mark" aria-hidden="true">☕</div>
        <div class="heading-copy">
          <p class="eyebrow">KNOLLAB 001 · 카페 주문 연습</p>
          <h1>버전별 체험</h1>
        </div>
        <p class="current-label" id="currentLabel" aria-live="polite">AI만 사용 · 버전 3</p>
      </div>
      <div class="switcher-grid">
        <nav class="nav-group" aria-label="실험 선택">
          <span class="group-label">실험 방식</span>
          <div class="button-row experiment-row">
            <a class="switch-link experiment-link" data-experiment="a-ai-only" href="https://luckybridge.github.io/knollab-001-a-ai-only/?version=3" aria-current="page"><span class="link-code">A</span><span>AI만 사용</span></a>
            <a class="switch-link experiment-link" data-experiment="b-design-md" href="https://luckybridge.github.io/knollab-001-b-design-md/?version=3"><span class="link-code">B</span><span>DESIGN.md</span></a>
            <a class="switch-link experiment-link" data-experiment="c-design-figma-mcp" href="https://luckybridge.github.io/knollab-001-c-design-figma-mcp/?version=3"><span class="link-code">C</span><span>Figma MCP</span></a>
            <a class="switch-link experiment-link" data-experiment="d-design-figma-mcp-actively" href="https://luckybridge.github.io/knollab-001-d-design-figma-mcp-actively/?version=1" title="D 실험은 버전 1만 제공됩니다"><span class="link-code">D</span><span>Figma MCP 적극 활용</span><span class="only-one">v1만</span></a>
          </div>
        </nav>
        <nav class="nav-group version-group" aria-label="버전 선택">
          <span class="group-label">체험 버전</span>
          <div class="button-row version-row">
            <a class="switch-link version-link" data-version="1" href="?version=1">버전 1</a>
            <a class="switch-link version-link" data-version="2" href="?version=2">버전 2</a>
            <a class="switch-link version-link" data-version="3" href="?version=3" aria-current="page">버전 3</a>
          </div>
        </nav>
      </div>
    </header>
    <main id="experience" class="experience" aria-label="카페 주문 연습 체험">
      <iframe id="versionFrame" title="실험 A, 버전 3 카페 주문 연습" src="versions/v3/index.html" loading="eager" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
    </main>
  </div>
</body>
</html>
